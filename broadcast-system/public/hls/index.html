<!DOCTYPE html>
<html>
<head>
    <title>HLS Stream Player - Racetrack Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e27; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        h1 { margin: 20px 0; font-size: 2.5em; color: #fff; }
        
        .player-section {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }
        
        #video {
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 15px 0;
        }
        
        button {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: linear-gradient(135deg, #0056b3 0%, #003f87 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,91,187,0.3);
        }
        
        button:active { transform: translateY(0); }
        
        .info-section {
            background: #0f1219;
            border-left: 4px solid #007bff;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 13px;
        }
        
        .info-label { color: #aaa; font-weight: 600; }
        .info-value { color: #00d9ff; font-family: 'Monaco', 'Courier New', monospace; }
        
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 5px 0;
        }
        
        .status-ready { background: #28a745; color: white; }
        .status-connecting { background: #ffc107; color: #000; }
        .status-playing { background: #17a2b8; color: white; }
        .status-error { background: #dc3545; color: white; }
        
        .stream-list {
            background: #1a1f3a;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .stream-list h3 {
            margin-bottom: 15px;
            color: #00d9ff;
        }
        
        .stream-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }
        
        .stream-btn {
            background: #2d3561;
            border: 1px solid #404d7a;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 500;
        }
        
        .stream-btn:hover {
            background: #3d4570;
            border-color: #007bff;
            color: #00d9ff;
        }
        
        .stream-btn.active {
            background: #007bff;
            border-color: #0056b3;
        }
        
        .error-message {
            background: #8b3a3a;
            color: #ffcccc;
            padding: 12px;
            border-radius: 5px;
            margin: 10px 0;
            display: none;
            border-left: 4px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 HLS Stream Player</h1>
        
        <div class="player-section">
            <video id="video" controls playsinline preload="auto"></video>
            
            <div class="controls">
                <button onclick="autoLoad()">▶ Auto Load</button>
                <button onclick="togglePlayPause()" id="playPauseBtn">⏯ Play/Pause</button>
                <button onclick="toggleMute()" id="muteBtn">🔊 Mute</button>
                <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button onclick="reloadStream()">🔄 Reload</button>
            </div>
            
            <div class="info-section">
                <div class="info-row">
                    <span class="info-label">Stream Status:</span>
                    <span id="status" class="status-badge status-ready">Ready</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Current Stream:</span>
                    <span class="info-value" id="currentStream">No stream selected</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Stream URL:</span>
                    <span class="info-value" id="streamUrl">-</span>
                </div>
                <div class="error-message" id="errorMsg"></div>
            </div>
        </div>
        
        <div class="stream-list">
            <h3>Available Streams</h3>
            <div class="stream-buttons" id="streamButtons">
                <button class="stream-btn" onclick="loadStream('rpicam1')">📹 RPi Cam 1</button>
                <button class="stream-btn" onclick="loadStream('rpicam2')">📹 RPi Cam 2</button>
                <button class="stream-btn" onclick="loadStream('rpicam3')">📹 RPi Cam 3</button>
                <button class="stream-btn" onclick="loadStream('test')">🧪 Test Stream</button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById("video");
        const statusElement = document.getElementById("status");
        const errorMsg = document.getElementById("errorMsg");
        const currentStreamDisplay = document.getElementById("currentStream");
        const streamUrlDisplay = document.getElementById("streamUrl");
        
        let currentStream = null;
        let hlsInstance = null;
        
        // Configuration
        const HLS_SERVER = "http://192.168.50.208:8888";
        
        function setStatus(message, type = 'ready') {
            statusElement.textContent = message;
            statusElement.className = `status-badge status-${type}`;
        }
        
        function showError(message) {
            errorMsg.textContent = "❌ " + message;
            errorMsg.style.display = "block";
            setStatus("Error", "error");
        }
        
        function hideError() {
            errorMsg.style.display = "none";
        }
        
        function updateStreamButtons() {
            const buttons = document.querySelectorAll('.stream-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                const streamName = btn.textContent.match(/([a-z0-9]+)/i)?.[1];
                if (streamName && streamName.toLowerCase() === currentStream?.toLowerCase()) {
                    btn.classList.add('active');
                }
            });
        }
        
        function loadStream(streamName) {
            hideError();
            currentStream = streamName;
            updateStreamButtons();
            
            currentStreamDisplay.textContent = streamName;
            const hlsUrl = `${HLS_SERVER}/${streamName}/index.m3u8`;
            streamUrlDisplay.textContent = hlsUrl;
            
            setStatus("Connecting...", "connecting");
            
            try {
                if (hlsInstance) {
                    hlsInstance.destroy();
                }
                
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true,
                        backBufferLength: 90,
                    });
                    
                    hlsInstance.loadSource(hlsUrl);
                    hlsInstance.attachMedia(video);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        setStatus("Playing ▶", "playing");
                        video.play().catch(e => {
                            showError("Playback failed: " + e.message);
                        });
                    });
                    
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    showError("Network error: Cannot reach stream server at " + HLS_SERVER);
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    showError("Media error: Invalid or corrupted stream");
                                    break;
                                default:
                                    showError("Fatal error: " + (data.reason || data.response?.status || "Unknown"));
                            }
                        }
                    });
                    
                } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    // Safari native HLS support
                    video.src = hlsUrl;
                    setStatus("Playing ▶ (Native)", "playing");
                    video.play().catch(e => {
                        showError("Playback failed: " + e.message);
                    });
                } else {
                    showError("HLS not supported in this browser. Please use Chrome, Firefox, Edge, or Safari.");
                }
            } catch (e) {
                showError("Error loading stream: " + e.message);
            }
        }
        
        function autoLoad() {
            loadStream("rpicam1");
        }
        
        function togglePlayPause() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        
        function toggleMute() {
            video.muted = !video.muted;
            document.getElementById("muteBtn").textContent = video.muted ? "🔇 Unmute" : "🔊 Mute";
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => {
                    showError("Fullscreen not available: " + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function reloadStream() {
            if (currentStream) {
                loadStream(currentStream);
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.target === document.body) {
                switch(e.code) {
                    case 'Space':
                        e.preventDefault();
                        togglePlayPause();
                        break;
                    case 'KeyF':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case 'KeyM':
                        e.preventDefault();
                        toggleMute();
                        break;
                }
            }
        });
        
        // Update button when video state changes
        video.addEventListener('play', () => {
            document.getElementById("playPauseBtn").textContent = "⏸ Pause";
            setStatus("Playing ▶", "playing");
        });
        
        video.addEventListener('pause', () => {
            document.getElementById("playPauseBtn").textContent = "▶ Play";
            setStatus("Paused", "ready");
        });
        
        // Initialize
        console.log("HLS Player initialized. Server: " + HLS_SERVER);
        setStatus("Ready - Select a stream to begin", "ready");
    </script>
</body>
</html>
