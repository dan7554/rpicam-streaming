# Nginx SSL configuration for broadcast system
# 
# ┌─────────────────────────────────────────────────────────────────────────┐
# │                          SSL/TLS ARCHITECTURE                           │
# ├─────────────────────────────────────────────────────────────────────────┤
# │                                                                         │
# │ Internet Client                                                         │
# │    ↓ (HTTPS - Cloudflare Cert)                                         │
# │ Cloudflare CDN (SSL/TLS proxy)                                          │
# │    ↓ (HTTPS - AWS ACM Cert)                                            │
# │ ALB Port 443 (AWS Certificate Manager)                                  │
# │    ↓ (HTTP - unencrypted, internal AWS network)                        │
# │ ECS Task Port 80                                                        │
# │    ↓ (HTTPS - Self-signed, optional defense-in-depth)                  │
# │ Nginx Port 443 (this config)                                            │
# │    ↓ (HTTP - service discovery DNS inside VPC)                         │
# │ ├─ MediaMTX Service :8888 (internal HLS)                               │
# │ ├─ Express.js :3001 (internal API)                                     │
# │ └─ React Static Files (local /app/client/dist)                         │
# │                                                                         │
# │ NOTES:                                                                  │
# │ • ALB terminates public SSL (AWS ACM certificate)                       │
# │ • Nginx provides optional SSL encryption to services                    │
# │ • Self-signed certificates for internal use only                        │
# │ • Cloudflare handles client-facing SSL and caching                      │
# │ • All service-to-service communication inside VPC is encrypted         │
# │                                                                         │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Upstream servers (must be at http level, not inside server blocks)

# MediaMTX upstream - commenting out to avoid startup resolution issues
# Will use variable resolution in location blocks instead
# upstream mediamtx_server {
#     server mediamtx-service.broadcast-cluster.ecs.local:8888;
#     keepalive 32;
# }

upstream broadcast_server {
    server localhost:3001;
    keepalive 32;
}

# Port 8888 server - alternate health check (optional, no longer needed)
# Kept for backward compatibility - responds with health check
server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name _;
    
    # Health check endpoint - respond with 200 OK
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # Forward other traffic to main HTTP server
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}


# HTTP server - handle all traffic from ALB (ALB terminates SSL/TLS)
# ALB forwards HTTPS traffic to this port 80 after SSL termination
# DO NOT redirect to HTTPS here - that causes redirect loops
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    # Buffer settings for streaming
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Timeouts for streaming
    proxy_connect_timeout 60s;
    proxy_send_timeout 86400s;
    proxy_read_timeout 86400s;
    client_body_timeout 86400s;
    client_header_timeout 86400s;
    keepalive_timeout 86400s;

    # Health check endpoint - respond with 200 OK (for ALB)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # ACME challenges for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HLS streaming proxy → MediaMTX service at /hls/
    location /hls/ {
        # Use DNS resolver for dynamic resolution (avoids nginx startup failure)
        resolver 169.254.169.253 valid=10s;
        set $mediamtx_backend "mediamtx-service.broadcast-cluster.ecs.local:8888";
        
        # Proxy to MediaMTX HLS server
        proxy_pass http://$mediamtx_backend/;
        proxy_http_version 1.1;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebRTC/WHEP streaming proxy → MediaMTX service at /[stream]/whep
    # Enables WebRTC playback through ALB
    location ~ ^/([^/]+)/whep$ {
        # Use DNS resolver for dynamic resolution
        resolver 169.254.169.253 valid=10s;
        set $mediamtx_backend "mediamtx-service.broadcast-cluster.ecs.local:8888";
        
        proxy_pass http://$mediamtx_backend/$1/whep;
        proxy_http_version 1.1;
        
        # WebRTC requires specific headers
        proxy_set_header Connection "upgrade";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # MediaMTX API proxy → /v3/ endpoints (must use prefix match, not regex)
    # Exposes MediaMTX API for camera queries, stats, etc.
    # Prefix location takes priority over catch-all /
    location /v3/ {
        # Use DNS resolver for dynamic resolution
        resolver 169.254.169.253 valid=10s;
        set $mediamtx_backend "mediamtx-service.broadcast-cluster.ecs.local:8888";
        
        proxy_pass http://$mediamtx_backend/v3/;
        proxy_http_version 1.1;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # Socket.IO WebSocket endpoint (CRITICAL: must come before /api/)
    # Socket.IO path is /socket.io/ by default
    location /socket.io {
        proxy_pass http://broadcast_server/socket.io;
        proxy_http_version 1.1;
        
        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Socket.IO needs these timeouts to be long for persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
    }

    # API endpoints - rewrite /api/ prefix to backend routes
    # Uses regex with ^ anchor to ensure this matches before /
    # Example: /api/cameras → broadcast_server/cameras
    location ~ ^/api/(.*)$ {
        # When using regex location with proxy_pass, the $1 capture group
        # can be used in the proxy_pass URL to strip the /api/ prefix
        proxy_pass http://broadcast_server/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # Static assets and React SPA (lowest priority)
    # This location serves static files and falls back to index.html for client-side routing
    location / {
        # Try to serve file from dist directory
        # If not found as file or directory, serve index.html (for client-side React routing)
        try_files $uri $uri/ /index.html;
        root /app/client/dist;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }
}

