# Nginx SSL configuration for broadcast system
# Upstream servers
upstream broadcast_server {
    server localhost:3001;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    location /.well-known/acme-challenge/ {
        # Allow ACME challenges for Let's Encrypt
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    
    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # OCSP Stapling for better certificate validation
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/certs/server.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CORS headers (can be adjusted as needed)
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
    gzip_vary on;

    # Client → Static files (React app) at /
    # Health check endpoint (highest priority)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # HLS streaming page → Serve HTML5 player at /hls/
    location /hls/ {
        # Serve an HLS player page
        default_type text/html;
        
        # Return embedded HLS player HTML
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>HLS Stream Player - Racetrack Streaming</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: white; }
        #video { width: 100%; max-width: 1200px; margin: 20px 0; background: #000; aspect-ratio: 16/9; }
        .container { max-width: 1300px; margin: 0 auto; }
        .controls { margin: 20px 0; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #0056b3; }
        .info { background: #333; padding: 15px; border-radius: 5px; margin-top: 20px; font-family: monospace; font-size: 12px; }
        h1 { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>HLS Stream Viewer</h1>
        <video id="video" controls playsinline></video>
        <div class="controls">
            <button onclick="autoLoad()">Auto Load</button>
            <button onclick="togglePlayPause()">Play/Pause</button>
            <button onclick="toggleFullscreen()">Fullscreen</button>
        </div>
        <div class="info">
            <p><strong>URL Path:</strong> <code id="streamPath"></code></p>
            <p><strong>Status:</strong> <code id="status">Ready</code></p>
            <p><strong>Note:</strong> Streams are served from local MediaMTX via HTTP on port 8888</p>
        </div>
    </div>
    <script>
        const video = document.getElementById("video");
        const pathElement = document.getElementById("streamPath");
        const statusElement = document.getElementById("status");
        
        const streamPath = window.location.pathname;
        pathElement.textContent = streamPath;
        
        const streamName = streamPath.replace(/^\/hls\//, "").replace(/\/$/, "") || "default";
        const hlsUrl = "http://192.168.50.208:8888/" + streamName + "/index.m3u8";
        
        function autoLoad() {
            loadStream();
        }
        
        function loadStream() {
            statusElement.textContent = "Connecting...";
            try {
                if (Hls.isSupported()) {
                    if (window.hls) window.hls.destroy();
                    window.hls = new Hls({ debug: false });
                    window.hls.loadSource(hlsUrl);
                    window.hls.attachMedia(video);
                    window.hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        statusElement.textContent = "Playing";
                        video.play().catch(e => statusElement.textContent = "Playback failed: " + e.message);
                    });
                    window.hls.on(Hls.Events.ERROR, (event, data) => {
                        statusElement.textContent = "Error: " + (data.response?.status || data.reason || "Unknown");
                    });
                } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.src = hlsUrl;
                    statusElement.textContent = "Playing (native)";
                    video.play();
                } else {
                    statusElement.textContent = "HLS not supported in this browser";
                }
            } catch (e) {
                statusElement.textContent = "Error: " + e.message;
            }
        }
        
        function togglePlayPause() {
            if (video.paused) video.play();
            else video.pause();
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => alert("Fullscreen failed: " + err.message));
            } else {
                document.exitFullscreen();
            }
        }
        
        window.addEventListener("load", () => {
            console.log("HLS player loaded. Streaming from: " + hlsUrl);
        });
    </script>
</body>
</html>';
    }
    }

    # API routes → Express server at /api (before catch-all /)
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        
        # Rewrite /api/* to /* for Express routes
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://broadcast_server;
        proxy_http_version 1.1;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts and buffering
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # WebSocket endpoint → Express server (Socket.io) (before catch-all /)
    location /socket.io {
        proxy_pass http://broadcast_server;
        proxy_http_version 1.1;
        
        # Headers for proxying
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support - critical for socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # Client SPA → Static files + fallback to index.html (catch-all, lowest priority)
    location / {
        limit_req zone=general burst=20 nodelay;
        
        # Serve static files from client/dist
        root /app/client/dist;
        
        # Try to serve file, if not found try index.html (SPA)
        try_files $uri $uri/ /index.html;
        
        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache HTML
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HLS streaming server on port 8888
server {
    listen 8888 default_server;
    listen [::]:8888 default_server;
    server_name _;

    # Allow large uploads for streaming
    client_max_body_size 0;

    # HLS stream proxy
    location / {
        proxy_pass http://localhost:8554;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Extended timeouts for streaming
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

