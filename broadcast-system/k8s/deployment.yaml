apiVersion: v1
kind: Namespace
metadata:
  name: broadcast-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: broadcast-system
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
      worker_connections 1024;
      use epoll;
      multi_accept on;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
      access_log /var/log/nginx/access.log main;
      sendfile on;
      tcp_nopush on;
      tcp_nodelay on;
      keepalive_timeout 65;
      types_hash_max_size 2048;
      client_max_body_size 20M;
      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level 6;
      gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
      include /etc/nginx/conf.d/*.conf;
    }
  
  default.conf: |
    upstream broadcast_server {
      server broadcast-system-svc:3001;
      keepalive 32;
    }

    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;
      location / {
        return 301 https://$host$request_uri;
      }
    }

    server {
      listen 443 ssl http2 default_server;
      listen [::]:443 ssl http2 default_server;
      server_name _;
      ssl_certificate /etc/nginx/certs/server.crt;
      ssl_certificate_key /etc/nginx/certs/server.key;
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_ciphers HIGH:!aNULL:!MD5;
      ssl_prefer_server_ciphers on;
      ssl_session_cache shared:SSL:10m;
      ssl_session_timeout 10m;
      
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;

      location / {
        root /app/client/dist;
        try_files $uri $uri/ /index.html;
      }

      location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://broadcast_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }

      location /socket.io {
        proxy_pass http://broadcast_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
      }

      location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
      }
    }

---
apiVersion: v1
kind: Secret
metadata:
  name: broadcast-ssl-certs
  namespace: broadcast-system
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUV2QUNDQXFBSUJBREJICjB3WWRCUmNGQjBJRUJBQURZZUJnQ3FVRUFZSXhDbU5WVGtSSVRVbEdNREJ6TnpVNU5qRTEKTkVoa1VuTlhZa1JQWTBwQ01HSXhNQkJnTlZCQXcVC... # Base64 encoded certificate
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCk1JSUV2QUlCQURBTkJna3Foa2lHOXcwQkFRRUZBQVNDQktjd2dnS2pBZ0VBQW9JQkFRRFU1dndFR0JtWWlKa0h3CkJZTUJBQUVBVUFBQU... # Base64 encoded key

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcast-system
  namespace: broadcast-system
  labels:
    app: broadcast-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcast-system
  template:
    metadata:
      labels:
        app: broadcast-system
    spec:
      containers:
      - name: broadcast-system
        image: broadcast-system:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: express
          containerPort: 3001
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: MEDIAMTX_URL
          valueFrom:
            configMapKeyRef:
              name: broadcast-config
              key: mediamtx-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx
          readOnly: true
        - name: ssl-certs
          mountPath: /etc/nginx/certs
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: ssl-certs
        secret:
          secretName: broadcast-ssl-certs
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - broadcast-system
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: broadcast-system-svc
  namespace: broadcast-system
  labels:
    app: broadcast-system
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  - name: express
    port: 3001
    targetPort: 3001
    protocol: TCP
  selector:
    app: broadcast-system

---
apiVersion: v1
kind: Service
metadata:
  name: broadcast-system-lb
  namespace: broadcast-system
  labels:
    app: broadcast-system
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app: broadcast-system
  sessionAffinity: ClientIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: broadcast-system-hpa
  namespace: broadcast-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: broadcast-system
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: broadcast-system-pdb
  namespace: broadcast-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: broadcast-system
