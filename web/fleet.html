<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet — Camera Fleet Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; padding: 20px; }

        h1 { font-size: 22px; margin-bottom: 6px; color: #fff; }
        .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
        .subtitle a { color: #58a6ff; text-decoration: none; }

        .fleet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 16px;
        }

        .device-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 16px;
            position: relative;
        }
        .device-card.offline { opacity: 0.5; }

        .device-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .device-name { font-size: 18px; font-weight: 600; color: #fff; }
        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.online { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
        .status-dot.stale { background: #d29922; box-shadow: 0 0 6px #d29922; }
        .status-dot.offline { background: #f85149; box-shadow: 0 0 6px #f85149; }

        .device-status { font-size: 12px; color: #888; margin-left: auto; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
        }

        .stat {
            background: #0d1117;
            border-radius: 6px;
            padding: 8px 10px;
        }
        .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 16px; font-weight: 600; color: #e0e0e0; margin-top: 2px; }
        .stat-value.warn { color: #d29922; }
        .stat-value.danger { color: #f85149; }
        .stat-value.good { color: #3fb950; }

        .stream-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .stream-badge.active { background: #1a3d2a; color: #3fb950; }
        .stream-badge.stopped { background: #3d1a1a; color: #f85149; }

        .starlink-section {
            background: #0d1117;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 14px;
        }
        .starlink-header { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .starlink-stats { display: flex; gap: 16px; font-size: 13px; flex-wrap: wrap; }
        .starlink-stats span { color: #e0e0e0; }
        .starlink-stats .label { color: #888; }
        .starlink-unreachable { color: #f85149; font-size: 13px; }

        .last-seen { font-size: 11px; color: #666; margin-top: 8px; text-align: right; }

        .no-devices {
            text-align: center;
            color: #666;
            padding: 60px 20px;
            font-size: 16px;
        }
        .no-devices code { background: #161b22; padding: 2px 8px; border-radius: 4px; color: #e0e0e0; }

        .refresh-info { font-size: 12px; color: #555; position: fixed; bottom: 12px; right: 16px; }
    </style>
</head>
<body>
    <h1>Fleet Manager</h1>
    <div class="subtitle"><a href="/">← Back to Dashboard</a> &nbsp;|&nbsp; Auto-refreshes every 5s</div>

    <div id="fleet-grid" class="fleet-grid">
        <div class="no-devices" id="no-devices">
            No devices reporting yet.<br><br>
            Deploy the health agent to your Pis:<br>
            <code>./rpi/fleet-ctl.sh deploy-agent rpicam3</code>
        </div>
    </div>

    <div class="refresh-info" id="refresh-info"></div>

<script>
const POLL_INTERVAL = 5000;

function formatUptime(secs) {
    if (secs < 60) return secs + 's';
    if (secs < 3600) return Math.floor(secs / 60) + 'm';
    if (secs < 86400) {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        return h + 'h ' + m + 'm';
    }
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    return d + 'd ' + h + 'h';
}

function timeAgo(isoStr) {
    const diff = Math.floor((Date.now() - new Date(isoStr).getTime()) / 1000);
    if (diff < 10) return 'just now';
    if (diff < 60) return diff + 's ago';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

function deviceStatus(lastSeen) {
    const ageSec = (Date.now() - new Date(lastSeen).getTime()) / 1000;
    if (ageSec < 60) return 'online';
    if (ageSec < 300) return 'stale';
    return 'offline';
}

function tempClass(temp) {
    if (temp >= 80) return 'danger';
    if (temp >= 65) return 'warn';
    return 'good';
}

function diskClass(pct) {
    if (pct >= 90) return 'danger';
    if (pct >= 75) return 'warn';
    return '';
}

function renderDevice(dev) {
    const status = deviceStatus(dev.lastSeen);
    const sl = dev.starlink || {};

    let starlinkHtml = '';
    if (sl.reachable) {
        starlinkHtml = `
            <div class="starlink-section">
                <div class="starlink-header">Starlink</div>
                <div class="starlink-stats">
                    <span><span class="label">Ping:</span> ${sl.latencyMs || '?'}ms</span>
                    <span><span class="label">Down:</span> ${sl.downlinkMbps || 0} Mbps</span>
                    <span><span class="label">Up:</span> ${sl.uplinkMbps || 0} Mbps</span>
                    ${sl.obstructed ? '<span style="color:#f85149">OBSTRUCTED</span>' : ''}
                    ${sl.uptimeS > 0 ? `<span><span class="label">Dish:</span> ${formatUptime(sl.uptimeS)}</span>` : ''}
                </div>
            </div>`;
    } else {
        starlinkHtml = `
            <div class="starlink-section">
                <div class="starlink-header">Starlink</div>
                <div class="starlink-unreachable">Dish unreachable</div>
            </div>`;
    }

    return `
        <div class="device-card ${status === 'offline' ? 'offline' : ''}">
            <div class="device-header">
                <span class="status-dot ${status}"></span>
                <span class="device-name">${dev.device}</span>
                <span class="device-status">${status.toUpperCase()} · ${dev.bootMode || '?'}</span>
            </div>

            <div class="stats-grid">
                <div class="stat">
                    <div class="stat-label">Stream</div>
                    <div class="stat-value">
                        <span class="stream-badge ${dev.streamActive ? 'active' : 'stopped'}">
                            ${dev.streamActive ? 'Streaming' : 'Stopped'}
                        </span>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-label">CPU Temp</div>
                    <div class="stat-value ${tempClass(dev.cpuTemp)}">${dev.cpuTemp}°C</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Uptime</div>
                    <div class="stat-value">${formatUptime(dev.uptimeS)}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Disk</div>
                    <div class="stat-value ${diskClass(dev.diskPct)}">${dev.diskPct}%</div>
                </div>
            </div>

            ${starlinkHtml}

            <div style="display:flex; gap:6px; font-size:12px; color:#888;">
                <span>IP: ${dev.tailscaleIp || dev.localIp || '?'}</span>
                ${dev.localIp && dev.tailscaleIp ? `<span>· LAN: ${dev.localIp}</span>` : ''}
            </div>

            <div class="last-seen">Last seen: ${timeAgo(dev.lastSeen)}</div>
        </div>
    `;
}

async function refresh() {
    try {
        const resp = await fetch('/api/fleet/status');
        const devices = await resp.json();

        const grid = document.getElementById('fleet-grid');
        const noDevices = document.getElementById('no-devices');

        if (!devices || devices.length === 0) {
            noDevices.style.display = 'block';
            return;
        }
        noDevices.style.display = 'none';

        // Sort: online first, then by name
        devices.sort((a, b) => {
            const sa = deviceStatus(a.lastSeen);
            const sb = deviceStatus(b.lastSeen);
            const order = { online: 0, stale: 1, offline: 2 };
            if (order[sa] !== order[sb]) return order[sa] - order[sb];
            return a.device.localeCompare(b.device);
        });

        grid.innerHTML = devices.map(renderDevice).join('');

        document.getElementById('refresh-info').textContent =
            `${devices.length} device${devices.length !== 1 ? 's' : ''} · Updated ${new Date().toLocaleTimeString()}`;
    } catch (e) {
        console.error('Fleet refresh failed:', e);
    }
}

refresh();
setInterval(refresh, POLL_INTERVAL);
</script>
</body>
</html>
