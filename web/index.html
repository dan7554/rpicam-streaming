<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Switcher</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎥</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <header>
        <h1>Stream Switcher</h1>
        <div id="live-badge" class="badge hidden">LIVE</div>
        <span id="build-version" class="build-version"></span>
    </header>

    <main>
        <!-- Stream Previews -->
        <section id="previews">
            <h2>Camera Feeds
                <label class="cam-toggle"><input type="checkbox" id="cam-previews-enabled" checked onchange="toggleCamPreviews()"> Show Previews</label>
                <a href="/viewer" target="_blank" class="viewer-link">Open Viewer ↗</a>
                <a href="/fleet" target="_blank" class="viewer-link">Fleet ↗</a>
            </h2>
            <div class="grid" id="camera-grid">
                <!-- Populated by JS -->
            </div>
        </section>

        <!-- Live Output Controls -->
        <section id="youtube-controls">
            <h2>Live Output</h2>
            <div class="controls">
                <input type="text" id="youtube-key" placeholder="YouTube Stream Key (leave empty for local preview)" autocomplete="off">
                <div class="btn-group">
                    <label class="audio-toggle"><input type="checkbox" id="audio-enabled" checked>Audio</label>
                    <button id="btn-go-live" onclick="goLive()">Go Live</button>
                    <button id="btn-stop" onclick="stopLive()" disabled>Stop</button>
                </div>
            </div>
            <div id="status-bar">
                <span id="status-text">Idle</span>
                <span id="active-stream"></span>
            </div>
        </section>

        <!-- Overlay Controls -->
        <section id="overlay-controls">
            <h2>Timing Overlay</h2>
            <div class="controls">
                <input type="text" id="overlay-url" placeholder="SpeedHive URL or Event ID" autocomplete="off">
                <input type="text" id="overlay-title" placeholder="Custom title (optional, overrides SpeedHive)" autocomplete="off">
                <div class="overlay-options">
                    <label for="overlay-format">Format:</label>
                    <select id="overlay-format">
                        <option value="full">Full (P, #, Name, Laps, Gap)</option>
                        <option value="condensed" selected>Condensed (P, #, J. Doe, Gap)</option>
                        <option value="condensed-nogap">Condensed No Gap (P, #, J. Doe)</option>
                        <option value="short">Short (P, #, J. Doe, Gap)</option>
                        <option value="short-nogap">Short No Gap (P, #, J. Doe)</option>
                        <option value="minimal">Minimal (P, #, Gap)</option>
                    </select>
                    <label for="overlay-max-rows">Rows:</label>
                    <input type="number" id="overlay-max-rows" min="3" max="30" value="25">
                    <label for="overlay-scale">Scale:</label>
                    <input type="number" id="overlay-scale" min="1" max="4" value="1" style="width:50px">
                </div>
                <div class="btn-group">
                    <button id="btn-overlay-start" onclick="startOverlay()">Start Overlay</button>
                    <button id="btn-overlay-update" onclick="updateOverlay()" disabled>Update</button>
                    <button id="btn-overlay-stop" onclick="stopOverlay()" disabled>Stop</button>
                </div>
            </div>
            <div class="flag-controls hidden" id="flag-controls">
                <label>Flag:</label>
                <button class="flag-btn flag-red" onclick="setFlag('Red Flag')">Red Flag</button>
                <button class="flag-btn flag-yellow" onclick="setFlag('Yellow Flag')">Yellow Flag</button>
                <button class="flag-btn flag-green" onclick="setFlag('Green Flag')">Green Flag</button>
                <button class="flag-btn flag-checkered" onclick="setFlag('Checkered Flag')"></button>
                <button class="flag-btn flag-clear" onclick="setFlag('')">Clear</button>
                <span id="flag-status-text" class="flag-status-text"></span>
            </div>
            <div id="overlay-status-bar">
                <span id="overlay-status-text">Off</span>
                <span id="overlay-competitors"></span>
            </div>
        </section>

        <!-- Advertisements -->
        <section id="ads-section">
            <div class="ads-card">
                <div class="ads-left">
                    <h2>Advertisements</h2>
                    <div class="ad-upload">
                        <input type="file" id="ad-file" accept="video/*" style="display:none" onchange="uploadAd()">
                        <button onclick="document.getElementById('ad-file').click()">＋ Upload Video</button>
                        <span id="ad-upload-status"></span>
                    </div>
                    <table id="ads-table" class="ads-table">
                        <thead>
                            <tr>
                                <th style="width:32px"><input type="checkbox" id="ads-select-all" onchange="toggleAllAds(this.checked)"></th>
                                <th>Name</th>
                                <th style="width:70px">Duration</th>
                                <th style="width:90px">Status</th>
                                <th style="width:100px;text-align:right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ads-tbody">
                            <tr class="ads-empty-row"><td colspan="5" style="text-align:center;color:#555;padding:20px">No ads uploaded</td></tr>
                        </tbody>
                    </table>
                    <div class="ads-controls">
                        <button id="btn-ads-play" onclick="playSelectedAds()" disabled>▶ Play Selected</button>
                        <button id="btn-ads-stop" onclick="stopAds()" disabled>■ Stop Ads</button>
                    </div>
                </div>
                <div class="ads-right">
                    <div id="ad-preview-container" class="ad-preview-empty">
                        <div class="ad-preview-placeholder">No preview</div>
                        <video id="ad-preview-video" controls></video>
                    </div>
                    <div id="ad-playback-bar" class="hidden">
                        <span id="ad-playback-text"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Commentary -->
        <section id="commentary-section">
            <h2>Commentary</h2>
            <div class="controls commentary-controls">
                <div class="commentary-mic-select">
                    <label>Input Device: <select id="mic-device" onchange="saveMicDevice()"><option value="">Default</option></select></label>
                </div>
                <div class="commentary-slots">
                    <div class="commentary-slot" id="commentary-slot-0">
                        <span class="slot-label">Commentator 1</span>
                        <button id="btn-comm-0" onclick="toggleCommentary(0)">Join</button>
                        <button id="btn-kick-0" class="kick-btn hidden" onclick="kickCommentary(0)">Kick</button>
                        <label>Mic: <input type="range" id="comm-vol-0" min="0" max="100" value="100" oninput="updateCommentaryVolume()"> <span id="comm-vol-0-val">100%</span></label>
                        <span id="comm-status-0" class="comm-status">Disconnected</span>
                    </div>
                    <div class="commentary-slot" id="commentary-slot-1">
                        <span class="slot-label">Commentator 2</span>
                        <button id="btn-comm-1" onclick="toggleCommentary(1)">Join</button>
                        <button id="btn-kick-1" class="kick-btn hidden" onclick="kickCommentary(1)">Kick</button>
                        <label>Mic: <input type="range" id="comm-vol-1" min="0" max="100" value="100" oninput="updateCommentaryVolume()"> <span id="comm-vol-1-val">100%</span></label>
                        <span id="comm-status-1" class="comm-status">Disconnected</span>
                    </div>
                </div>
                <div class="commentary-master">
                    <label>Camera Audio: <input type="range" id="camera-vol" min="0" max="100" value="30" oninput="updateCommentaryVolume()"> <span id="camera-vol-val">30%</span> <small>(applies on Go Live)</small></label>
                </div>
            </div>
        </section>

        <!-- Live Output Preview -->
        <section id="output-section" class="hidden">
            <h2>Live Output Preview</h2>
            <div class="output-card">
                <video id="video-output" autoplay playsinline controls></video>
                <div class="output-controls">
                    <button id="btn-toggle-preview" class="preview-toggle-btn" onclick="toggleOutputPreview()">⏸ Pause Preview</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js?v=8"></script>
</body>
</html>
