version: '3.8'

services:
  mediamtx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mediamtx-server
    restart: unless-stopped
    ports:
      - "8554:8554"     # RTSP
      - "1935:1935"     # RTMP
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC
      - "9996:9996"     # SRT
      - "9997:9997"     # API
      - "8890:8890/udp" # WebRTC UDP
      - "8189:8189/udp" # WebRTC UDP
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=localhost
    volumes:
      - ./mediamtx-container.yml:/app/mediamtx.yml:ro
      - ./server.crt:/app/server.crt:ro
      - ./server.key:/app/server.key:ro
      - ./recordings:/app/recordings
    networks:
      - mediamtx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:9997/v3/config/global/get"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  broadcast-system:
    build:
      context: .
      dockerfile: broadcast-system/Dockerfile
    container_name: broadcast-system
    restart: unless-stopped
    ports:
      - "80:80"         # HTTP (redirects to HTTPS)
      - "443:443"       # HTTPS
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MEDIAMTX_URL=https://mediamtx:8889
      - BROADCAST_HOSTNAME=local.broadcast.com
      - BROADCAST_PORT=443
    volumes:
      - ./broadcast-system/certs:/etc/nginx/certs
    networks:
      - broadcast-network
      - mediamtx-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mediamtx-network:
    driver: bridge

  broadcast-network:
    driver: bridge