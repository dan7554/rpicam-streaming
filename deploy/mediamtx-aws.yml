###############################################
# MediaMTX config - AWS production
###############################################

logLevel: info
logDestinations: [stdout]

# API
api: yes
apiAddress: :9997

# RTSP (internal: bridge ↔ MediaMTX ↔ GStreamer)
rtsp: yes
rtspAddress: 0.0.0.0:8554
rtspTransports: [tcp]

# HLS disabled (YouTube handles distribution)
hls: no

# RTMP - ingest from Pi cameras
rtmp: yes
rtmpAddress: 0.0.0.0:1935

# WebRTC - low-latency preview for admin UI
webrtc: yes
webrtcAddress: :8889

# ICE configuration for WebRTC behind NLB
# __EIP__ is replaced automatically by `make deploy` with the Terraform EIP
webrtcICEHostNAT1To1IPs: [__EIP__]
webrtcICEUDPMuxAddress: :8189
webrtcICETCPMuxAddress: :8189

# Disable unused
srt: no

# Path defaults
pathDefaults:
  record: no

# Stream paths
paths:
  cam1:
  cam2:
  cam3:
  live-output:
  live-preview:
  commentary-1:
  commentary-2:
  commentary-1-whip:
    overridePublisher: yes
  commentary-2-whip:
    overridePublisher: yes
  all_others:
