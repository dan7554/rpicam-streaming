<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaMTX Stream Player with Scrubbing</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #1a1a1a; color: white; }
        .player-container { background: #2a2a2a; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        video { width: 100%; max-width: 800px; border-radius: 5px; }
        .controls { margin-top: 15px; }
        .url-input { width: 100%; max-width: 600px; padding: 10px; margin: 10px 0; border: 1px solid #555; border-radius: 5px; background: #333; color: white; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .info { background: #333; padding: 15px; border-radius: 5px; margin-top: 20px; }
        .status { margin-top: 10px; padding: 10px; border-radius: 5px; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🎬 MediaMTX Stream Player</h1>
    <div class="player-container">
        <h2>Live Stream with Scrubbing</h2>
        <video id="video" controls>
            Your browser does not support the video tag.
        </video>
        <div class="controls">
            <input type="text" id="streamUrl" class="url-input" 
                   placeholder="Enter HLS stream URL" 
                   value="http://stream.racetrackstreaming.com:8888/rpicam/index.m3u8">
            <br>
            <button onclick="loadStream()">Load Stream</button>
            <button onclick="togglePlayPause()">Play/Pause</button>
            <button onclick="seekBackward()">⏪ -10s</button>
            <button onclick="seekForward()">⏩ +10s</button>
            <button onclick="toggleMute()">🔊 Mute</button>
        </div>
        <div id="status" class="status" style="display: none;"></div>
    </div>
    <script>
        const video = document.getElementById("video");
        const streamUrlInput = document.getElementById("streamUrl");
        const statusDiv = document.getElementById("status");
        let hls = null;
        function loadStream() {
            const url = streamUrlInput.value.trim();
            if (!url) return;
            if (hls) hls.destroy();
            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
            }
        }
        function togglePlayPause() { video.paused ? video.play() : video.pause(); }
        function seekBackward() { video.currentTime = Math.max(0, video.currentTime - 10); }
        function seekForward() { video.currentTime = Math.min(video.duration, video.currentTime + 10); }
        function toggleMute() { video.muted = !video.muted; }
        window.addEventListener("load", function() { if (streamUrlInput.value) setTimeout(loadStream, 1000); });
    </script>
</body>
</html>
