<!DOCTYPE html>
<html>
<head>
    <title>RPi Camera Stream - Production</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }
        .status {
            margin-bottom: 20px;
            padding: 12px;
            background: #1a1f3a;
            border-left: 4px solid #00d4ff;
            border-radius: 4px;
            font-size: 14px;
        }
        .status.error { border-left-color: #ff4444; }
        .status.success { border-left-color: #44ff44; }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .info-card {
            background: #1a1f3a;
            padding: 15px;
            border-radius: 6px;
            border-left: 3px solid #00d4ff;
        }
        
        .info-card h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #00d4ff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        
        .info-card p {
            font-size: 14px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #00f0ff;
            transform: translateY(-2px);
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 50%;
            border-top-color: #00d4ff;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 RPi Camera Stream</h1>
        <div class="status" id="status">
            <span class="spinner"></span>Loading stream...
        </div>
        
        <div class="video-container">
            <video id="videoElement" controls autoplay></video>
        </div>
        
        <div class="controls">
            <button onclick="reloadStream()">🔄 Reload Stream</button>
            <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
            <button onclick="openDirect()">🔗 Direct Stream</button>
        </div>
        
        <div class="info-grid">
            <div class="info-card">
                <h3>Source</h3>
                <p id="source-info">RPi Camera (IMX477)</p>
            </div>
            <div class="info-card">
                <h3>Stream URL</h3>
                <p id="stream-url">stream.racetrackstreaming.com/hls/rpicam2/index.m3u8</p>
            </div>
            <div class="info-card">
                <h3>Resolution</h3>
                <p id="resolution-info">1280x720 @ 25 fps</p>
            </div>
            <div class="info-card">
                <h3>Codec</h3>
                <p id="codec-info">H.264 (AVC)</p>
            </div>
            <div class="info-card">
                <h3>Network</h3>
                <p id="network-info">CloudFlare Tunnel</p>
            </div>
            <div class="info-card">
                <h3>Infrastructure</h3>
                <p id="infra-info">AWS NLB → MediaMTX ECS → HLS</p>
            </div>
        </div>
    </div>
    <script>
        const videoElement = document.getElementById('videoElement');
        const statusElement = document.getElementById('status');
        
        // Direct NLB endpoints (bypassing CloudFlare redirects)
        const streamUrls = [
            // Try direct NLB HTTPS first (may not work without proper cert)
            'https://broadcast-nlb-rtmp-555bec420c441233.elb.us-east-1.amazonaws.com:8888/hls/rpicam2/index.m3u8',
            // Then try CloudFlare with proper path
            'https://stream.racetrackstreaming.com/hls/rpicam2/index.m3u8',
            // Fallback: direct via Tailscale (if on Tailscale network)
            'http://100.100.74.51:8888/hls/rpicam2/index.m3u8',
        ];
        
        let currentUrlIndex = 0;
        
        function loadStream() {
            if (currentUrlIndex >= streamUrls.length) {
                statusElement.className = 'status error';
                statusElement.innerHTML = `
                    ❌ <strong>Stream Unavailable</strong><br>
                    <small>Try: <a href="#" onclick="openVlcGuide(); return false;">VLC Player (RTSP)</a> instead</small>
                `;
                return;
            }
            
            const streamUrl = streamUrls[currentUrlIndex];
            const hostname = new URL(streamUrl).hostname;
            statusElement.innerHTML = `<span class="spinner"></span>Connecting to ${hostname}...`;
            
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    debug: false,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });
                
                hls.loadSource(streamUrl);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    statusElement.className = 'status success';
                    statusElement.innerHTML = '✅ Stream loaded from ' + hostname;
                    videoElement.play().catch(() => {
                        statusElement.innerHTML = '✅ Stream ready (click play)';
                    });
                });
                
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.log(`Failed (${data.details}), trying next URL...`);
                        currentUrlIndex++;
                        setTimeout(loadStream, 1000);
                    }
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
                videoElement.addEventListener('loadedmetadata', () => {
                    statusElement.className = 'status success';
                    statusElement.innerHTML = '✅ Stream loaded (Safari)';
                    videoElement.play().catch(() => {});
                }, { once: true });
                
                videoElement.addEventListener('error', () => {
                    currentUrlIndex++;
                    if (currentUrlIndex < streamUrls.length) {
                        setTimeout(loadStream, 1000);
                    }
                }, { once: true });
            } else {
                statusElement.className = 'status error';
                statusElement.innerHTML = '❌ HLS not supported. Try VLC Player with RTSP instead.';
            }
        }
        
        function openVlcGuide() {
            alert(`RTSP Direct Stream (Works in VLC, ffplay)\n\nURL: rtsp://broadcast-nlb-rtmp-555bec420c441233.elb.us-east-1.amazonaws.com:8554/rpicam2\n\nVLC Steps:\n1. Open VLC\n2. Media → Open Network Stream\n3. Paste URL above\n4. Click Play`);
        }
        
        function reloadStream() {
            currentUrlIndex = 0;
            loadStream();
        }
        
        function toggleFullscreen() {
            if (videoElement.requestFullscreen) {
                videoElement.requestFullscreen();
            }
        }
        
        function openDirect() {
            window.open(streamUrls[0], '_blank');
        }
        
        window.addEventListener('load', loadStream);
    </script>
</body>
</html>
