###############################################
# MediaMTX config - local dev (fake streams)
###############################################

# Logging
logLevel: info
logDestinations: [stdout]

# API - used by Go server to query stream status
api: yes
apiAddress: :9997

# RTSP server - receives streams from FFmpeg and RPi cameras
rtsp: yes
rtspAddress: 0.0.0.0:8554
rtspTransports: [udp, tcp]

# HLS server - serves streams to web UI for preview
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency
hlsAlwaysRemux: yes
hlsSegmentCount: 3
hlsSegmentDuration: 500ms
hlsPartDuration: 100ms
hlsSegmentMaxSize: 200M
hlsMuxerCloseAfter: 10s

# RTMP - used for YouTube output and RPi camera ingest
rtmp: yes
rtmpAddress: 0.0.0.0:1935

# WebRTC - optional, for low-latency preview
webrtc: yes
webrtcAddress: :8889

# Disable unused protocols
srt: no

# Path defaults
pathDefaults:
  record: no

# Stream paths
paths:
  cam1:
  cam2:
  cam3:
  live-output:
  live-preview:
  all_others:
