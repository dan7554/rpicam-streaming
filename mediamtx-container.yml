# Container-optimized MediaMTX configuration
# This version uses absolute paths that work inside Docker containers

###############################################
# Global settings -> General

logLevel: info
logDestinations: [stdout]
logFile: /app/mediamtx.log
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512
udpMaxPayloadSize: 1472

###############################################
# Global settings -> Authentication

authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
      - action: metrics
      - action: pprof
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

###############################################
# Global settings -> Control API

api: yes
apiAddress: 0.0.0.0:9997
apiEncryption: no
apiAllowOrigins: ["*"]

###############################################
# Global settings -> Metrics

metrics: no
metricsAddress: 0.0.0.0:9998
metricsEncryption: no
metricsServerKey: /app/server.key
metricsServerCert: /app/server.crt
metricsAllowOrigins: ["*"]

###############################################
# Global settings -> PPROF

pprof: no
pprofAddress: 0.0.0.0:9999
pprofEncryption: no
pprofServerKey: /app/server.key
pprofServerCert: /app/server.crt
pprofAllowOrigins: ["*"]

###############################################
# Global settings -> Playback server

playback: yes
playbackAddress: 0.0.0.0:9996
playbackEncryption: no
playbackServerKey: /app/server.key
playbackServerCert: /app/server.crt
playbackAllowOrigins: ["*"]

###############################################
# Global settings -> RTSP server

rtsp: yes
rtspTransports: [udp, multicast, tcp]
rtspEncryption: "no"
rtspAddress: 0.0.0.0:8554
rtspsAddress: :8322
rtpAddress: :8000
rtcpAddress: :8001
multicastIPRange: 224.1.0.0/16
multicastRTPPort: 8002
multicastRTCPPort: 8003
srtpAddress: :8004
srtcpAddress: :8005
multicastSRTPPort: 8006
multicastSRTCPPort: 8007
rtspServerKey: /app/server.key
rtspServerCert: /app/server.crt
rtspAuthMethods: [basic]

###############################################
# Global settings -> RTMP server

rtmp: yes
rtmpAddress: 0.0.0.0:1935
rtmpEncryption: "no"
rtmpsAddress: :1936
rtmpServerKey: /app/server.key
rtmpServerCert: /app/server.crt

###############################################
# Global settings -> HLS server

hls: yes
hlsAddress: 0.0.0.0:8888
hlsEncryption: no
hlsServerKey: /app/server.key
hlsServerCert: /app/server.crt
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: ""
hlsMuxerCloseAfter: 60s

###############################################
# Global settings -> WebRTC server

webrtc: yes
webrtcAddress: 0.0.0.0:8889
webrtcEncryption: no
webrtcServerKey: /app/server.key
webrtcServerCert: /app/server.crt
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8889
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [mediamtx.racetrackstreaming.com]
webrtcICEServers2: []
webrtcHandshakeTimeout: 10s
webrtcTrackGatherTimeout: 5s

###############################################
# Global settings -> SRT server

srt: yes
srtAddress: 0.0.0.0:8891

###############################################
# Default path settings

pathDefaults:
  sourceOnDemand: no
  sourceOnDemandStartTimeout: 10s
  sourceOnDemandCloseAfter: 10s
  maxReaders: 0
  
  # Recording settings with absolute paths
  record: yes
  recordPath: /app/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordMaxPartSize: 50M
  recordSegmentDuration: 1h
  recordDeleteAfter: 6h

###############################################
# Specific paths

paths:
  rpicam3:
    source: publisher
    record: yes
    sourceOnDemandStartTimeout: 20s

  rpicam2:
    source: publisher
    record: yes
    sourceOnDemandStartTimeout: 20s
    
  rpicam:
    source: publisher
    record: yes
    sourceOnDemandStartTimeout: 20s